; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare_lcd28c
; Windows MAX_PATH (260): LVGL's "../" include chains plus this project's deep folder
; overflow it, and gcc then reports lv_conf_internal.h as missing. Keep libraries on a short path.
libdeps_dir = C:/pio_deps

; Waveshare ESP32-S3-Touch-LCD-2.8C: ESP32-S3R8 (16 MB flash, 8 MB octal PSRAM).
; boards/esp32-s3-devkitc-1-n16r8v.json describes that module.
[env:waveshare_lcd28c]
; pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12 on ESP-IDF 5.5.5 (latest stable release).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
extra_scripts = pre:scripts/lvgl_skip_drivers.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -Imodule
    -Isrc
lib_deps =
    workloads/SCServo@^1.0.1
    lvgl/lvgl@~9.2.2
