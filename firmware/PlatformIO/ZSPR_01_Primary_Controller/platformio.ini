; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1-n4v]
platform = espressif32
board = esp32-s3-devkitc-1-n4v
framework = arduino
; board_build.partitions = default_4MB.csv
; board_upload.flash_size = 4MB
; extra_scripts = post:erase_before_upload.py
lib_ldf_mode = deep+
build_flags = 
	; -DBOARD_HAS_PSRAM
	; -DARDUINO_USB_MODE=1
	; -DARDUINO_USB_CDC_ON_BOOT=1
	-Iinclude
	-Imodule
	-Ilib/IO_Expander
lib_deps = 
	lib/Display
	lib/Robot_Face
	lib/INA232
	lib/CLI
	lib/HostProtocol
	arduino-libraries/Arduino_BMI270_BMM150@^1.2.3
	gmarty2000/Buzzer@^1.0.0
	adafruit/Adafruit MMC56x3@^1.0.2
	janelia-arduino/AT42QT@^0.7.2
	stm32duino/STM32duino VL53L8CX@^2.1.0
	workloads/SCServo@^1.0.1
	bodmer/TFT_eSPI@^2.5.43
	milad-nikpendar/initGT911@^1.0.0
