; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1-n16r8v]
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
build_type = debug
; board_build.partitions = default_4MB.csv
; board_upload.flash_size = 4MB
; extra_scripts = post:erase_before_upload.py
lib_ldf_mode = deep+
; Robot-specific code lives in src/ZSPR_Robot_01 (HAL_Robot_Module.cpp is compiled with
; the rest of src/). Its headers are included by bare name via the -I paths below.
; debug_build_flags =
; 	-O0
; 	-g
; 	-ggdb
build_flags =
	-DBOARD_HAS_PSRAM
	; -DDEBUG=1
	; -DCORE_DEBUG_LEVEL=5
	; -DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-Iinclude
	-Isrc
	-Isrc/ZSPR_Robot_01
	-Isrc/ZSPR_Robot_01/modules
	-Ilib/IO_Expander
	-Ilib/NVS_Store
	; Bottango: the shim replaces its Servo class, stop() leaves Bottango mode
	; instead of rebooting (see lib/BottangoArduinoDriver/ZSPR_PATCHES.md).
	-DZSPR_SERVO_SHIM
	-DZSPR_NO_REBOOT_ON_STOP
	-Ilib/BottangoArduinoDriver
	-Ilib/ZSPR_Bottango_Driver
	; Bottango driver headers reference ../BottangoArduinoCallbacks.h etc. and the
	; virtual PCA9685 shim must win over any real Adafruit_PWMServoDriver.
	; -Ilib/Bottango
	; -Ilib/BottangoLink
	; SD_CHIP_SELECT_MODE=2 means SdFat does not define sdCsInit/sdCsWrite
	; itself -- our own SDCard_Module provides them, routed through
	; board_pinMode/board_digitalWrite so the CS pin can live on the IO
	; expander instead of a native GPIO.
	; -DSD_CHIP_SELECT_MODE=2
monitor_speed = 115200
monitor_filters = colorize, esp32_exception_decoder
lib_deps =
	; Local libraries used only from headers under src/ZSPR_Robot_01 (the LDF doesn't reach them there).
	SCServo
	Display
	INA232
	CLI
	HostProtocol
	initGT911
	VL53L8CX
	ZSPR_Bottango_Driver
	BottangoArduinoDriver
	; lib/Display
	; lib/Robot_Face
	; lib/INA232
	; lib/CLI
	; lib/HostProtocol
	; lib/VL53L8CX
	greiman/SdFat@2.3.1
	arduino-libraries/Arduino_BMI270_BMM150@^1.2.3
	; gmarty2000/Buzzer@^1.0.0
	adafruit/Adafruit MMC56x3@^1.0.2
	janelia-arduino/AT42QT@^0.7.2
	; lib/SCServo (local RTOS-safe copy of workloads/SCServo, see lib/SCServo/RTOS_PATCHES.md)
	bodmer/TFT_eSPI@^2.5.43
	; lib/initGT911
